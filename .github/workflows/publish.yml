name: Stage npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Require an exact version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Stage package for approval
        run: pnpm --package=npm@11.19.1 dlx npm stage publish . --provenance --access public
